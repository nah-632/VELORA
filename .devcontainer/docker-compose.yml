# The dev environment: the app, and a real PostgreSQL.
#
# A real one, not PGlite. PGlite is what makes the suite runnable on a phone, and it stays for that;
# but a schema that has only ever been applied to a WebAssembly PostgreSQL is a schema whose
# migrations, roles and extensions are untested against a server. Here the same migrations run
# against postgres:16 through `npm run db:migrate`, and the difference has caught real things.

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    command: sleep infinity
    volumes:
      - ../..:/workspaces/VELORA:cached
    environment:
      # Development-only values. The production ones live in CranL's environment and are never in
      # this repository.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://velora:velora@db:5432/velora
      SESSION_SECRET: codespace-development-only-not-a-production-secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    # The app's postCreate runs `npm ci`; this makes sure the database is actually accepting
    # connections before anything tries to migrate into it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - velora-db:/var/lib/postgresql/data

volumes:
  velora-db:

<pre id="readout">measuring…</pre>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var phase = q.get("phase") || "sealed";
  var card = q.get("card");          // "0" or "50": the card frozen part-way up the rise
  var broken = q.get("broken") === "1";

  document.querySelectorAll(".seal-stage, .envelope").forEach(function (el) {
    el.dataset.phase = phase;
  });
  document.querySelector(".seal").dataset.broken = broken ? "true" : "false";

  // The card's rise is a 900ms transition. To photograph a midpoint the harness sets the transform
  // directly and says so in the readout — a frozen frame, not an animation.
  var frozen = null;
  if (card !== null) {
    var cardEl = document.querySelector(".envelope__card");
    var pct = Number(card) / 100;                     // 0 = at rest, 1 = fully risen
    var y = -46 * pct, s = 0.98 + 0.02 * pct;
    frozen = "translateY(" + y.toFixed(2) + "%) scale(" + s.toFixed(3) + ")";
    cardEl.style.transition = "none";
    cardEl.style.transform = frozen;
    cardEl.style.opacity = "1";
  }

  function px(n) { return Math.round(n * 10) / 10 + "px"; }

  function measure() {
    var out = [];
    var sheets = document.styleSheets;
    var rules = 0, loaded = [];
    for (var i = 0; i < sheets.length; i++) {
      try {
        rules += sheets[i].cssRules.length;
        loaded.push((sheets[i].href || "inline").split("/").pop() + " (" + sheets[i].cssRules.length + " rules)");
      } catch (e) {
        loaded.push((sheets[i].href || "inline").split("/").pop() + " (BLOCKED)");
      }
    }
    var env = document.querySelector(".envelope").getBoundingClientRect();
    var disc = document.querySelector(".seal__disc").getBoundingClientRect();
    var flap = getComputedStyle(document.querySelector(".envelope__flap"));
    var cardEl = document.querySelector(".envelope__card");
    var liner = getComputedStyle(document.querySelector(".envelope__liner"));

    out.push("<b>stylesheets</b>  " + loaded.join(" · "));
    out.push("<b>rules</b>        " + rules);
    out.push("<b>phase</b>        " + phase + (broken ? " (broken)" : ""));
    out.push("<b>.envelope</b>    " + px(env.width) + " x " + px(env.height) +
             "   centre " + px(env.left + env.width / 2) + "," + px(env.top + env.height / 2));
    out.push("<b>.seal__disc</b>   " + px(disc.width) + " x " + px(disc.height) +
             "   centre " + px(disc.left + disc.width / 2) + "," + px(disc.top + disc.height / 2) +
             "   delta-vs-envelope " + px(disc.left + disc.width / 2 - (env.left + env.width / 2)));
    out.push("<b>flap</b>         clip-path " + flap.clipPath);
    out.push("<b>flap transform</b> " + flap.transform + "  (transition " + flap.transitionDuration + ")");
    out.push("<b>card</b>         " + (frozen ? "FROZEN @" + card + "% → " + frozen : "at rest") +
             "   computed transform " + getComputedStyle(cardEl).transform);
    out.push("<b>liner</b>        opacity " + liner.opacity + "  transition " + liner.transitionDuration +
             " " + liner.transitionDelay);
    out.push("<b>fonts</b>        " + (document.fonts ? document.fonts.size + " faces, status " + document.fonts.status : "n/a"));

    var nameEl = document.querySelector(".envelope__name");
    var nameCs = getComputedStyle(nameEl);
    out.push("<b>name</b>         \"" + nameEl.textContent + "\" opacity " + nameCs.opacity +
             "  mask-position " + (nameCs.maskPosition || nameCs.webkitMaskPosition) +
             "  mask-size " + (nameCs.maskSize || nameCs.webkitMaskSize) +
             "  animation " + nameCs.animationName);

    // Hit-testing: T1 C7 wants the button at the seal's centre, in every phase.
    var hit = document.elementFromPoint(disc.left + disc.width / 2, disc.top + disc.height / 2);
    out.push("<b>elementFromPoint(seal centre)</b> " + (hit ? hit.tagName + "." + (hit.className.baseVal !== undefined ? hit.className.baseVal : hit.className) : "null") +
             " → inside the button: " + (hit ? !!hit.closest(".seal.envelope__open") : false));

    document.getElementById("readout").innerHTML = out.join("\n");
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { requestAnimationFrame(function () { requestAnimationFrame(measure); }); });
  }
  requestAnimationFrame(function () { requestAnimationFrame(measure); });
})();
</script>
